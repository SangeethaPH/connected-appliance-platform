spring:
  application:
    name: appliance-infrastructure-manager
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_PROCESSOR_GROUP:appliance-metric-processor-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.connectedhome.infra.messaging.RawMetricEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    listener:
      ack-mode: record
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}
  credentials:
    encryption-key: ${CREDENTIAL_ENCRYPTION_KEY}
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:true}
    topics:
      raw-metrics: ${KAFKA_RAW_METRICS_TOPIC:appliance.metrics.raw.v1}
      validated-metrics: ${KAFKA_VALIDATED_TOPIC:appliance.metrics.validated.v1}
      quarantine: ${KAFKA_QUARANTINE_TOPIC:appliance.metrics.quarantine.v1}
      dead-letter: ${KAFKA_DLT_TOPIC:appliance.metrics.dlt.v1}
    groups:
      ingress: ${KAFKA_INGRESS_GROUP:appliance-ingress-validator-v1}
      processor: ${KAFKA_PROCESSOR_GROUP:appliance-metric-processor-v1}
  reporting:
    zone: ${REPORTING_ZONE:Asia/Kolkata}
    scheduling-enabled: ${REPORT_SCHEDULING_ENABLED:true}
    daily-cron: ${DAILY_REPORT_CRON:0 5 0 * * *}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
