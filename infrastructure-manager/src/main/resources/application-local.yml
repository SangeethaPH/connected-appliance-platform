spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appliances}
    username: ${DB_USERNAME:appliance_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: INFO
