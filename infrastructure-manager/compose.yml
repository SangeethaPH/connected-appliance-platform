services:
  postgres:
    image: postgres:17-alpine
    container_name: appliance-postgres
    environment:
      POSTGRES_DB: appliances
      POSTGRES_USER: appliance_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
    ports:
      - "5432:5432"
    volumes:
      - appliance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appliance_user -d appliances"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  appliance-postgres-data:
